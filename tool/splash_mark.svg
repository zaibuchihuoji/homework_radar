<?xml version="1.0" encoding="utf-8"?>
<!-- 启动页品牌 mark（作业清单纸 + 截止时钟角标），与桌面图标同一构图
     （assets/icon/icon_foreground.svg），整体缩到 0.78 使最远点落在
     Android 12+ 启动屏圆形裁切安全半径内（512 视口安全半径 ≈171，
     mark 最远点 ≈152.5*0.78≈119 + 阴影余量 < 135）。
     resvg 导出 672px（224dp@3x）：
     - assets/splash/splash_mark.png → Flutter 启动页 144dp 盒子
     - drawable-xxhdpi/splash_mark.png → 原生 launch_background 144dp /
       A12+ windowSplashScreenAnimatedIcon（同一张，撤屏位置一致） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF923E"/>
      <stop offset="1" stop-color="#F3681A"/>
    </linearGradient>
    <filter id="paperShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="10" stdDeviation="9" flood-color="#160F55" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="1" dy="5" stdDeviation="5" flood-color="#160F55" flood-opacity="0.30"/>
    </filter>
  </defs>
  <g transform="translate(256,256) scale(0.78) translate(-256,-256)">
    <!-- 作业清单纸：微微倾斜的白纸 -->
    <g transform="rotate(-6 250 256)">
      <rect x="162" y="148" width="176" height="216" rx="20" fill="#FFFFFF" filter="url(#paperShadow)"/>
      <!-- 行1：橙色勾选 + 题目行 -->
      <circle cx="205" cy="195" r="13" fill="url(#orange)"/>
      <path d="M 199.5 195.5 L 204 200.5 L 212 190.5" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="228" y="190" width="88" height="10" rx="5" fill="#CBD8D0"/>
      <!-- 行2 -->
      <rect x="184" y="244" width="132" height="10" rx="5" fill="#CBD8D0"/>
      <!-- 行3 -->
      <rect x="184" y="297" width="106" height="10" rx="5" fill="#CBD8D0"/>
    </g>
    <!-- 截止时钟角标 -->
    <g>
      <circle cx="332" cy="336" r="42" fill="#0F6B54" filter="url(#badgeShadow)"/>
      <circle cx="332" cy="336" r="35" fill="url(#orange)"/>
      <path d="M 332 318 L 332 336 L 346 344" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
