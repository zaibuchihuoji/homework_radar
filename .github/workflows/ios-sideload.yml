name: iOS self-sign IPA

on:
  workflow_dispatch:
    inputs:
      validate_simulator:
        description: 'Run native tests (disable only for packaging changes after the same app sources passed)'
        type: boolean
        default: true
      desktop_only:
        description: 'Validate desktop automation only; app sources and device IPA already passed'
        type: boolean
        default: false
  push:
    branches: [main, fix/ios-sideload-build]
    paths:
      - 'ios/**'
      - 'scripts/ios/**'
      - '.github/workflows/ios-sideload.yml'

permissions:
  contents: read

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ML Kit's current pods exclude arm64 for iphonesimulator. Use an Intel
    # simulator host; the separate iphoneos Release build still targets arm64.
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify simulator build, Keychain, Chinese OCR and launch
        if: github.event_name != 'workflow_dispatch' || inputs.validate_simulator || inputs.desktop_only
        timeout-minutes: 35
        env:
          IOS_DESKTOP_ONLY: ${{ inputs.desktop_only && '1' || '0' }}
        run: bash scripts/ios/validate_simulator.sh
      - name: Capture native integration diagnostics on failure
        if: failure()
        run: |
          mkdir -p build/ios/qa
          cp ios/Podfile.lock build/ios/qa/Podfile.lock || true
          cat ios/Runner.xcworkspace/contents.xcworkspacedata > build/ios/qa/workspace.txt
          find build/ios -name '*Pods*Runner*' > build/ios/qa/pod-products.txt
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator -showBuildSettings > build/ios/qa/runner-settings.txt 2>&1 || true
          xcodebuild -project ios/Pods/Pods.xcodeproj -target Pods-Runner -configuration Debug -sdk iphonesimulator -showBuildSettings > build/ios/qa/pods-settings.txt 2>&1 || true
      - name: Build unsigned iPhone release
        if: github.event_name != 'workflow_dispatch' || !inputs.desktop_only
        run: flutter build ios --release --no-codesign
      - name: Package device IPA for Windows self-signing
        if: github.event_name != 'workflow_dispatch' || !inputs.desktop_only
        run: |
          bash scripts/ios/package_unsigned_ipa.sh
          cp ios/SELF_SIGNING.md build/ios/ipa/SELF_SIGNING.md
      - name: Save IPA and checksum
        if: github.event_name != 'workflow_dispatch' || !inputs.desktop_only
        uses: actions/upload-artifact@v4
        with:
          name: ios-self-sign-ipa
          path: build/ios/ipa/
          if-no-files-found: error
          retention-days: 30
      - name: Save native validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-validation
          path: build/ios/qa/
          if-no-files-found: ignore
          retention-days: 14
