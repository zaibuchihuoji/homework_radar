# 发布流水线：打 tag（v1.0.1 这类）推送即自动构建 release APK 并挂到 GitHub Release。
# 前置：仓库 Secrets 里配好 KEYSTORE_BASE64（upload-keystore.jks 的 base64）
# 和 KEYSTORE_PASSWORD；没配也能构建，但出来的是 debug 签名包（仅测试用）。
name: Release APK

# 新仓库默认 GITHUB_TOKEN 只读，创建 Release 需要 contents: write
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=homework_radar
          storeFile=upload-keystore.jks
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/

      # Versions through 1.1.1 pick the first APK, without checking architecture.
      # The REST API sorts assets by name. "app-all" must sort before "app-arm";
      # uploading a normal "app-release" first does not preserve its position.
      # New clients prefer per-ABI assets and retain app-release as a fallback.
      - name: Build legacy updater bootstrap APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/
          cp dist/app-release.apk dist/app-all-release.apk

      - name: Checksum APKs
        working-directory: dist
        run: sha256sum app-all-release.apk app-release.apk app-armeabi-v7a-release.apk app-arm64-v8a-release.apk app-x86_64-release.apk > SHA256SUMS

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-per-abi
          path: |
            dist/*.apk
            dist/SHA256SUMS

      - name: Publish legacy bootstrap first
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-all-release.apk
          generate_release_notes: true
          overwrite_files: false

      - name: Attach architecture APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/app-armeabi-v7a-release.apk
            dist/app-arm64-v8a-release.apk
            dist/app-x86_64-release.apk
            dist/SHA256SUMS
          overwrite_files: false
