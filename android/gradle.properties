org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 这批插件版本组合下 Kotlin 守护进程会触发增量缓存关闭断言
#（Could not close incremental caches，android_file_picker/package_info_plus 等
# 插件模块反复复现），关增量换稳定——本项目体量小，全量编译代价可接受
kotlin.incremental=false

# Every architecture uses the same incrementing versionCode for safe cross-package upgrades.
force-version-code-ignoring-abi=true
